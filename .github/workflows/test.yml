name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra train
      - run: uv run --frozen --extra train ruff check .
      - run: uv run --frozen --extra train ruff format --check .
      - run: uv run --frozen --extra train pytest -q
      - run: uv build --out-dir dist
      - run: uv run --frozen python scripts/verify-package-license.py dist

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
